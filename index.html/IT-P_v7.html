      data.bitrateUnit='Mb/s';
      delete data.purposeChoice;delete data.customScheme;delete data.containerChoice;delete data.customContainer;
    }const arr=mode==='test'?p.tests:p.profiles,existing=arr.find(x=>x.id===form.dataset.id),reason=data.reason;delete data.reason;data.camera=cameraName(p,data.cameraId);if(existing)Object.assign(existing,data);else arr.push({id:id(),...data});mutate(`${existing?'修改':'新增'}${mode==='test'?'测试配置':'录制方案'}：${data.camera}${reason?`；原因：${reason}`:''}`)}else if(mode==='confirm'){if(!p.dit||data.actor!==p.dit){toast('确认人员须从项目信息中的 DIT 选择。');return}if(!p.profiles.length){toast('请先建立至少一套录制方案。');return}p.status='locked';p.confirmedAt=now();p.confirmedBy=data.actor;mutate('确认基础录制参数'+(data.note?`：${data.note}`:''),data.actor)}else if(mode==='unlock'){if(!data.actor||!roles(p,'controller').includes(data.actor)||!data.reason){toast('请从 DIT、DP、大助、二助中选择并填写调整原因。');return}p.status='draft';p.confirmedAt='';p.confirmedBy='';mutate('重新开放参数调整；原因：'+data.reason,data.actor)}else if(mode.startsWith('delete-')){const kind=mode.slice(7),item=p[kind].find(x=>x.id===form.dataset.id);if(kind==='cameras'&&[...p.tests,...p.profiles].some(x=>x.cameraId===form.dataset.id)){toast('摄影机仍有关联记录，无法删除。');return}p[kind]=p[kind].filter(x=>x.id!==form.dataset.id);if(kind==='cameras'){p.cameras.forEach((c,i)=>c.letter=letter(i));p.nextCameraIndex=p.cameras.length;for(const r of [...p.tests,...p.profiles])r.camera=cameraName(p,r.cameraId,r.camera)}mutate(`删除${kind==='tests'?'测试配置':kind==='profiles'?'录制方案':'摄影机'}：${kind==='cameras'?item?.letter+'机':item?.camera||''}${data.reason?`；原因：${data.reason}`:''}`)}close();toast(storageError?'当前数据尚未保存，请立即导出备份。':'已更新并保存在本机')});
  $('#import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>10*1024*1024)throw Error('文件超过 10 MB。');const obj=JSON.parse(await file.text());if(obj.format!=='dit-prep-workbench'||obj.data?.version!==1||!Array.isArray(obj.data.projects)||obj.data.projects.some(p=>typeof p.id!=='string'||typeof p.name!=='string'||!Array.isArray(p.tests)||!Array.isArray(p.profiles)||!Array.isArray(p.history)))throw Error('不是本工作台的有效备份。');state=obj.data;for(const p of state.projects)normalizeProject(p);activeId=state.projects[0]?.id||'';view=activeId?'overview':'projects';persist();render();toast(storageError?'备份已载入，但本机保存失败。请检查浏览器存储。':'备份已导入。')}catch(err){toast('导入失败：'+err.message)}});
  if(migrated)persist();
  render();
})();
