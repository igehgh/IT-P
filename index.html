  function validCustomRows(value){
    if(!Array.isArray(value))return [];
    const used=new Set(CHECKLIST_ITEMS.keys());
    return value.filter(row=>{
      if(!row||typeof row!=='object'||!/^custom-[a-zA-Z0-9_-]{1,80}$/.test(row.id||'')||used.has(row.id)||typeof row.title!=='string'||!row.title.trim()||row.title.length>100)return false;
      used.add(row.id);return true;
    }).map(row=>({id:row.id,category:'自定义',title:row.title.trim(),detail:typeof row.detail==='string'?row.detail.slice(0,400):'',type:['通过 / 警告','通过 / 记录','记录'].includes(row.type)?row.type:'通过 / 警告',note:''}));
  }
  function customGroup(c){return {key:'custom',title:'自定义',rows:c.customChecklistRows||[]}}
  function checklistGroups(c){return [...CHECKLIST_GROUPS,customGroup(c)]}
  function checklistItem(c,itemId){return CHECKLIST_ITEMS.get(itemId)||(c.customChecklistRows||[]).find(row=>row.id===itemId)}
  function normalizeChecklist(c,p){
    const source=c.checklist&&typeof c.checklist==='object'&&!Array.isArray(c.checklist)?c.checklist:{};
    const legacyTesters=people(Object.values(source).map(r=>r&&typeof r.tester==='string'?r.tester:''));
    c.checklistTesters=Array.isArray(c.checklistTesters)?people(c.checklistTesters):legacyTesters.length?legacyTesters:people(p?.dit);c.manualChecklistTesters=people([...(c.manualChecklistTesters||[]),...c.checklistTesters.filter(name=>!projectStaff(p).includes(name))]);
    c.customChecklistRows=validCustomRows(c.customChecklistRows);
    c.checklist={};
    for(const item of [...CHECKLIST_UNIQUE,...c.customChecklistRows]){
      const key=item.id;
      const r=source[key];if(!r||typeof r!=='object'||Array.isArray(r))continue;
      const text=k=>typeof r[k]==='string'?r[k]:'';
      c.checklist[key]={status:checklistOptions(item).includes(r.status)?r.status:'',notes:text('notes'),updatedAt:text('updatedAt'),serial:text('serial'),firmware:text('firmware'),notApplicable:r.notApplicable===true};
    }
  }
  function checklistOptions(row){return row.type.split(' / ').map(x=>x==='记录'?'已记录':x)}

  function checklistStats(c,rows=[...CHECKLIST_UNIQUE,...(c.customChecklistRows||[])]){
    let done=0,warnings=0,excluded=0;
    for(const row of rows){const r=c.checklist?.[row.id];if(r?.notApplicable){excluded++;continue}if(r?.status&&(r.status!=='已记录'||checklistHasRecord(r)))done++;if(r?.status==='警告')warnings++}
    return {done,warnings,excluded,total:rows.length-excluded};
  }

  function checklistGroupSummary(c,g){const s=checklistStats(c,g.rows);return `${g.rows.length} 项 · 已完成 ${s.done}/${s.total}${s.warnings?' · 警告 '+s.warnings:''}${s.excluded?' · 不适用 '+s.excluded:''}`}

  function storageEstimate(x){

    if(!RAID_TYPES.includes(a.raid))return fail('请选择有效的 RAID 类型');
    if(!n||caps.some(c=>!(c>0)))return fail('请填写每块硬盘的有效容量');
    if(a.raid==='单盘'&&n!==1)return fail('单盘只能配置一块硬盘');

    if(a.raid==='RAID 1'&&n<2)return fail('RAID 1 至少需要 2 块硬盘');
    if(a.raid==='RAID 5'&&n<3)return fail('RAID 5 至少需要 3 块硬盘');
    if(a.raid==='RAID 6'&&n<4)return fail('RAID 6 至少需要 4 块硬盘');

    const m=Math.min(...caps),f={'单盘':1,'JBOD':n,'RAID 0':n,'RAID 1':1,'RAID 5':n-1,'RAID 6':n-2,'RAID 10':n/2}[a.raid];
    const capacity=a.raid==='JBOD'?caps.reduce((v,c)=>v+c,0):m*f;
    const usable=a.usable===''?capacity:storageNum(a.usable),used=a.used===''?0:storageNum(a.used);
    if(usable===null||used===null||usable>capacity+1e-9||used>usable+1e-9)return fail('可用容量不能超过阵列容量，已占用不能超过可用容量');
    const speed=key=>{const v=a.disks.map(d=>storageNum(d[key]));if(v.some(x=>!(x>0)))return null;const base=Math.min(...v);if(a.raid==='JBOD'||a.raid==='单盘')return base;if(a.raid==='RAID 1')return key==='read'?n*base:base;if(a.raid==='RAID 10')return (key==='read'?n:n/2)*base;return f*base};

  }

  function saveHandoverInline(target){
    const p=project();if(!p)return;const h=handoverData(p);
    if(target.dataset.handoverField)h[target.dataset.handoverField]=target.value;
    else if(target.dataset.handoverDisks){for(const diskId of JSON.parse(target.dataset.handoverDisks))h.diskStates[diskId]=target.value}
    else if(target.dataset.handoverDisk)h.diskStates={...h.diskStates,[target.dataset.handoverDisk]:target.value};
    else if(target.dataset.handoverList){const key=target.dataset.handoverList;if(!['folderRows','contactRows'].includes(key))return;const row=h[key].find(r=>r.id===target.dataset.rowId);if(!row||!Object.hasOwn(row,target.dataset.column))return;row[target.dataset.column]=target.value}
    syncHandoverLegacy(h);p.handover=h;persist();const span=target.nextElementSibling;if(span?.classList.contains('handover-print-value'))span.textContent=target.value||'—';
  }
  window.addEventListener('beforeprint',()=>{if(view!=='handover')return;document.querySelectorAll('[data-handover-field],[data-handover-disk],[data-handover-disks],[data-handover-list]').forEach(el=>{const span=el.nextElementSibling;if(span?.classList.contains('handover-print-value'))span.textContent=el.value||'—'})});

  function normalizeProject(p){

    p.audioDevices=Array.isArray(p.audioDevices)?p.audioDevices.filter(x=>x&&typeof x==='object'):[];

    p.collapsedShootingDays=Array.isArray(p.collapsedShootingDays)?p.collapsedShootingDays.filter(x=>typeof x==='string'):[];
    if(!Array.isArray(p.cameras)){
      const oldNames=[...new Set([...p.tests,...p.profiles].map(r=>r.camera).filter(Boolean))];
      p.cameras=oldNames.map((name,i)=>{
        const raw=name.replace(/^[a-z]_/,''),brand=/dj/i.test(raw)?'DJI':/ilce|sony/i.test(raw)?'Sony':'自定义';
        const model=raw==='ilce7rm5'?'ILCE-7RM5':raw==='djimini2'?'Mini 2':raw;
        return {id:id(),letter:letter(i),brand,model};
      });
      for(const r of [...p.tests,...p.profiles])if(!r.cameraId)r.cameraId=p.cameras.find(c=>oldNames[p.cameras.indexOf(c)]===r.camera)?.id||'';
      for(const [key,role] of [['photographer','photographers'],['firstAC','firstACs'],['secondAC','secondACs']])
        p[role]=people([...p[role],...p.tests.map(r=>r[key])]);
    }
    p.director=p.director||'';p.recordingSupervisor=String(p.recordingSupervisor||'');p.soundDirector=String(p.soundDirector||'');

      p.productionManager=old[0]||'';
      if(old.length>1)p.description=[p.description,'旧版其他制片主任：'+old.slice(1).join('、')].filter(Boolean).join('\n');
    }
    delete p.productionManagers;
    if(!Object.hasOwn(p,'executiveProducer'))p.executiveProducer='';
    if(p.productionManager){p.description=[p.description,'旧版制片主任：'+p.productionManager+'（请核对是否为总制片）'].filter(Boolean).join('\n');delete p.productionManager}
    delete p.productionManager;
    for(const r of p.tests)if(r.owner&&!p.cameraVendors.includes(r.owner))r.owner='';
    for(const r of p.profiles){if(r.bitrateUnit!=='Mb/s'){if(r.bitrate){if(r.bitrateUnit==='MB/s')r.bitrate=String(Number(r.bitrate)*8);else{r.notes=[r.notes,'旧码率：'+r.bitrate+' '+(r.bitrateUnit||'单位未标记')+'（请核对后填写 Mb/s）'].filter(Boolean).join('\n');r.bitrate=''}}r.bitrateUnit='Mb/s'}if(r.notes)r.notes=r.notes.replaceAll('（请核对后填写 MB/s）','（请核对后填写 Mb/s）');if(r.purpose==='常规录制')r.purpose='常规拍摄';else if(r.purpose==='高速录制')r.purpose='高速拍摄';else if(r.purpose==='航拍机')r.purpose='航拍';if(!r.sampling||!r.bitDepth){const old=String(r.color||'').toLowerCase();r.sampling=r.sampling||(/444|4:4:4/.test(old)?'4:4:4':/422|4:2:2/.test(old)?'4:2:2':/420|4:2:0/.test(old)?'4:2:0':/raw/.test(old)?'RAW':'未指定');r.bitDepth=r.bitDepth||(/16/.test(old)?'16-bit':/12/.test(old)?'12-bit':/10/.test(old)?'10-bit':/8/.test(old)?'8-bit':'未指定')}}

    }

  }

  function bitUnits(base){

  localStateStore.write=function(value){
    if(cloud.user){cloudCache();cloudSchedule()}
    else localWrite(value);
  };
  const baseStatus=renderStatus;
  renderStatus=function(){
    baseStatus();const el=$('#save-status');
    if(cloud.user&&el&&!storageError){el.textContent='● '+(navigator.onLine?cloud.status||'云端同步中':'离线 · 已保留本机待同步');el.classList.toggle('bad',!!Object.keys(cloud.conflicts).length)}
    const pill=$('.local-pill');if(pill)pill.innerHTML='<i></i>'+(cloud.user?'云端工作区':'仅保存在当前浏览器');
    const note=$('.side-note');if(note&&cloud.user)note.textContent=cloud.user.email;
    const actions=$('.top-actions');
    if(actions&&!$('#cloud-account')){
      actions.insertAdjacentHTML('afterbegin',`<button class="btn small" id="cloud-account" data-action="cloud-account">${cloud.user?'账号 / 同步':'云端登录'}</button>`);
      if(cloud.user)actions.insertAdjacentHTML('afterbegin',button('项目成员','cloud-members','small'));
    }
    cloudReadOnly();
  };
  function cloudReadOnly(){
    if(!cloud.user||TOOL_VIEWS.has(view))return;const p=project(),readonly=p&&!isBuiltinExample(p)&&cloud.roles[p.id]==='viewer';
    if(!readonly)return;
    document.querySelectorAll('.content input,.content textarea,.content select').forEach(el=>{
      if(!el.closest('.hero-actions')&&!['checklist-camera','audio-check-device','archive-overview-day','disk-archive-search','disk-archive-backup'].includes(el.id))el.disabled=true;
    });
    document.querySelectorAll('.content [data-action]').forEach(el=>{if(!cloudAllowedAction(el.dataset.action))el.disabled=true});
  }
  function cloudAllowedAction(action){return action?.startsWith('frame-')||['view','open-project','close','export','print','print-checklist','checklist-tab','camera-checklist','handover-print','disk-archive-print','disk-archive-filter','disk-archive-reset','archive-print','archive-day-toggle','archive-photo-preview','cloud-account','cloud-members'].includes(action)||action?.startsWith('backup-select-')}
  function cloudSchedule(){
    clearTimeout(cloud.timer);if(cloud.user&&!cloud.loading)cloud.timer=setTimeout(()=>cloudSync().catch(e=>{cloud.status=cloudError(e);renderStatus()}),900);
  }
  async function cloudClient(){
    if(cloud.client)return cloud.client;
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(cloudConfig.url)||!cloudConfig.key?.startsWith('sb_publishable_'))throw Error('请填写 Supabase Project URL 和 Publishable key。');
    if(!window.supabase){await new Promise((resolve,reject)=>{
      const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
      script.onload=resolve;script.onerror=()=>{script.remove();reject(Error('无法加载同步组件，请检查网络后重试。'))};document.head.appendChild(script);
    })}
    cloud.client=window.supabase.createClient(cloudConfig.url,cloudConfig.key,{auth:{storageKey:'dit-auth-'+new URL(cloudConfig.url).hostname,detectSessionInUrl:false}});
    cloud.client.auth.onAuthStateChange((event,session)=>{
      if(event==='TOKEN_REFRESHED'&&session)cloud.client.realtime.setAuth(session.access_token);
      if(event==='SIGNED_OUT'&&cloud.user)setTimeout(()=>cloudLeave(),0);
      if(event==='SIGNED_IN'&&cloud.user&&session?.user.id!==cloud.user.id)setTimeout(()=>cloudEnter(session.user).catch(error=>toast(cloudError(error))),0);
    });
    return cloud.client;
  }
  async function cloudEnter(user){
    if(cloud.user?.id===user.id)return;
    if(cloud.user)cloudLeave();
    localSnapshot=cloudCopy(state);cloud.user=user;cloud.sessionGeneration++;
    cloud.accountKey='dit-cloud-cache:'+new URL(cloudConfig.url).hostname+':'+user.id;
    let cached=null;try{cached=JSON.parse(localStorage.getItem(cloud.accountKey)||'null')}catch{}
    cloud.rows=cached?.rows||{};cloud.roles=cached?.roles||{};cloud.conflicts=cached?.conflicts||{};
    state=cached?.state||{version:1,projects:[cloudCopy(EMBEDDED_EXAMPLE)]};
    state.projects.forEach(normalizeProject);ensureBuiltinExample();activeId=state.activeId||state.projects[0]?.id||'';view='projects';
    cloud.status='正在读取云端';render();
    await cloudPull();
    const c=cloud.client;
    cloud.channel=c.channel('dit-workspace-'+user.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'dit_projects'},()=>cloudSchedulePull())
      .on('postgres_changes',{event:'*',schema:'public',table:'dit_members'},()=>cloudSchedulePull())
      .subscribe(status=>{if(status==='SUBSCRIBED')cloudSchedulePull();else if(['CHANNEL_ERROR','TIMED_OUT'].includes(status)){cloud.status='实时连接中断 · 将自动重试';renderStatus()}});
    cloudSchedule();
  }
  let cloudPullTimer;
  function cloudSchedulePull(){clearTimeout(cloudPullTimer);cloudPullTimer=setTimeout(()=>cloudPull().then(()=>cloudSchedule()).catch(e=>{cloud.status=cloudError(e);renderStatus()}),500)}
  function cloudLeave(){
    clearTimeout(cloud.timer);clearTimeout(cloudPullTimer);cloud.sessionGeneration++;
    if(cloud.user){try{cloudCache()}catch{}if(cloud.channel)cloud.client.removeChannel(cloud.channel)}
    cloud.user=null;cloud.rows={};cloud.roles={};cloud.conflicts={};cloud.channel=null;cloud.status='';
    state=localSnapshot||localRead()||initial();localSnapshot=null;activeId=state.activeId||state.projects[0]?.id||'';view='projects';close();render();
  }
  async function cloudPull(){
    if(!cloud.user||cloud.busy||cloud.loading)return;
    if($('#modal-root').firstChild||document.activeElement?.matches('.content input,.content textarea,.content select')){cloud.status='等待当前编辑完成后核对云端';renderStatus();return}
    const generation=cloud.sessionGeneration;cloud.loading=true;
    try{
      const [{data:rows,error},{data:members,error:memberError}]=await Promise.all([
        cloud.client.from('dit_projects').select('*'),cloud.client.from('dit_members').select('*').eq('user_id',cloud.user.id)
      ]);
      if(error||memberError)throw error||memberError;if(generation!==cloud.sessionGeneration)return;
      const incoming=new Map(rows.map(row=>[row.id,row]));let changed=false;
      for(const key of Object.keys(cloud.rows))if(!incoming.has(key)){
        state.projects=state.projects.filter(p=>p.id!==key);delete cloud.rows[key];delete cloud.roles[key];delete cloud.conflicts[key];changed=true;
      }
      for(const row of rows){
        const base=cloud.rows[row.id],p=state.projects.find(p=>p.id===row.id);
        const oldRole=cloud.roles[row.id];
        cloud.roles[row.id]=row.owner_id===cloud.user.id?'owner':members.find(m=>m.project_id===row.id)?.role||'viewer';
        if(base&&base.revision===row.revision&&oldRole===cloud.roles[row.id])continue;
        if(base&&(!p||projectJSON(p)!==base.json)&&cloud.roles[row.id]!=='viewer'){
          cloud.conflicts[row.id]=row;continue;
        }
        delete cloud.conflicts[row.id];state.projects=state.projects.filter(p=>p.id!==row.id);
        if(!row.deleted){const content=cloudCopy(row.content);normalizeProject(content);state.projects.push(content);cloud.rows[row.id]={revision:row.revision,json:projectJSON(content)}}
        else{delete cloud.rows[row.id];delete cloud.roles[row.id]}
        changed=true;
      }
      cloud.status=Object.keys(cloud.conflicts).length?'有版本冲突 · 点击账号 / 同步处理':'已与云端同步';
      cloudCache();if(changed){
        // Wait until a focused field or open dialog is finished before refreshing its DOM.
        if(!$('#modal-root').firstChild&&!document.activeElement?.matches('input,textarea,select'))render();else cloud.status='收到云端更新 · 完成当前编辑后刷新';
      }renderStatus();
    }finally{cloud.loading=false}
  }
  async function cloudSync(){
    if(!cloud.user||cloud.busy||cloud.loading||!navigator.onLine)return;
    cloud.busy=true;const generation=cloud.sessionGeneration;
    try{
      for(const p of state.projects.filter(p=>!isBuiltinExample(p))){
        if(generation!==cloud.sessionGeneration)return;
        if(cloud.conflicts[p.id]||cloud.roles[p.id]==='viewer')continue;
        normalizeProject(p);let base=cloud.rows[p.id],snapshot=cloudCopy(p);
        const pendingPhotos=(snapshot.archive||[]).some(r=>(r.photos||[]).some(ph=>!ph.cloudPath));
        if(base&&projectJSON(snapshot)===base.json&&!pendingPhotos)continue;
        cloud.status='正在保存到云端';renderStatus();
        // Establish a parent row before uploading new evidence photos.
        if(!base){
          const result=await cloud.client.rpc('dit_save',{p_id:p.id,p_expected:0,p_content:snapshot});if(result.error)throw result.error;
          if(generation!==cloud.sessionGeneration)return;
          base=cloud.rows[p.id]={revision:result.data.revision,json:projectJSON(snapshot)};cloud.roles[p.id]='owner';cloudCache();
        }
        for(const r of snapshot.archive||[])for(const ph of r.photos||[]){
          if(ph.cloudPath)continue;
          const value=await localPhotoData(ph.id);if(!value)throw Error('现场照片在当前设备中缺失，请补齐后再同步。');
          const blob=await (await fetch(value)).blob(),path=p.id+'/'+ph.id+'.jpg';
          const {error}=await cloud.client.storage.from('dit-photos').upload(path,blob,{upsert:true,contentType:blob.type});if(error)throw error;
          if(generation!==cloud.sessionGeneration)return;
          ph.cloudPath=path;const live=p.archive?.flatMap(r=>r.photos||[]).find(x=>x.id===ph.id);if(live)live.cloudPath=path;
        }
        const result=await cloud.client.rpc('dit_save',{p_id:p.id,p_expected:base.revision,p_content:snapshot});
        if(generation!==cloud.sessionGeneration)return;
        if(result.error){if(result.error.message.includes('CONFLICT')){cloud.conflicts[p.id]={id:p.id};await cloudCache();continue}throw result.error}
        cloud.rows[p.id]={revision:result.data.revision,json:projectJSON(snapshot)};cloudCache();
      }
      for(const [key,base] of Object.entries(cloud.rows)){
        if(state.projects.some(p=>p.id===key)||cloud.conflicts[key])continue;
        const result=await cloud.client.rpc('dit_save',{p_id:key,p_expected:base.revision,p_content:JSON.parse(base.json),p_deleted:true});
        if(generation!==cloud.sessionGeneration)return;
        if(result.error){cloud.conflicts[key]={id:key};continue}delete cloud.rows[key];delete cloud.roles[key];
      }
      cloud.status=Object.keys(cloud.conflicts).length?'有版本冲突 · 点击账号 / 同步处理':'已与云端同步';cloudCache();
    }finally{cloud.busy=false;renderStatus()}
    if(cloud.user)cloudSchedulePull();
    if(cloud.user&&state.projects.some(p=>!isBuiltinExample(p)&&!cloud.conflicts[p.id]&&cloud.roles[p.id]!=='viewer'&&projectJSON(p)!==cloud.rows[p.id]?.json))cloudSchedule();
  }
  const localPhotoData=photoData;
  photoData=async function(photoId,value){
    let result=await localPhotoData(photoId,value);
    if(value!==undefined||result||!cloud.user)return result;
    const photo=state.projects.flatMap(p=>p.archive||[]).flatMap(r=>r.photos||[]).find(p=>p.id===photoId);
    if(!photo?.cloudPath)return result;
    const {data,error}=await cloud.client.storage.from('dit-photos').download(photo.cloudPath);if(error)throw error;
    result=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(data)});
    await localPhotoData(photoId,result);return result;
  };
  function cloudAccount(){
    if(cloud.user){
      const conflicts=Object.keys(cloud.conflicts);
      modal('账号 / 同步',`<p>${esc(cloud.user.email)}</p><p>${esc(cloud.status)}</p>${button('立即同步','cloud-sync')}${button('退出云端账号','cloud-logout')} ${conflicts.map(key=>`<div class="notice"><p>${esc(state.projects.find(p=>p.id===key)?.name||key)}：云端和本机都已修改。</p>${button('导出本机版本','cloud-conflict-export','small',`data-id="${esc(key)}"`)}${button('采用云端版本','cloud-conflict-reload','small',`data-id="${esc(key)}"`)}</div>`).join('')}`, '关闭',{mode:'cloud-close'});return;
    }
    if(!cloudConfig.url||!cloudConfig.key)return cloudSettings();
    modal('云端登录',`<div class="form-grid">${field('email','邮箱','','','email','full')}${field('password','密码（至少 8 位）','','','password','full')}<p class="full">首次使用请注册；注册后按邮件提示确认邮箱。</p>${button('注册账号','cloud-signup')}${button('连接设置','cloud-settings')}</div>`,'登录',{mode:'cloud-login'});
  }
  function cloudSettings(){modal('连接 Supabase',`<div class="form-grid">${field('url','Project URL',cloudConfig.url,'https://项目编号.supabase.co','url','full')}${field('key','Publishable key',cloudConfig.key,'以 sb_publishable_ 开头','text','full')}</div>`,'保存连接设置',{mode:'cloud-config'})}
  async function cloudMembers(){
    const p=project();if(!cloud.user||!p||isBuiltinExample(p)||cloud.roles[p.id]!=='owner'){toast('请打开你创建的云端项目。');return}
    const {data,error}=await cloud.client.rpc('dit_list_members',{p_id:p.id});if(error)throw error;
    modal('项目成员',`<p>对方须先注册。本操作只授予项目权限，不会发送邮件。</p>${handoverTable(['邮箱','权限'],data.map(x=>[x.email,x.role==='editor'?'可编辑':'只查看']))}<div class="form-grid">${field('email','成员邮箱','','','email','full')}${field('role','权限','viewer','viewer|editor|remove','select','full')}<p class="full">viewer = 只查看 · editor = 可编辑 · remove = 移除成员</p></div>`,'保存权限',{mode:'cloud-member',id:p.id});
  }
  async function cloudForm(form){
    const data=Object.fromEntries(new FormData(form)),mode=form.dataset.mode;
    if(mode==='cloud-config'){
      if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(data.url)||!data.key.startsWith('sb_publishable_'))throw Error('连接信息格式不正确。只可使用 Publishable key。');
      cloudConfig={url:data.url.replace(/\/$/,''),key:data.key.trim()};localStorage.setItem('dit-cloud-config',JSON.stringify(cloudConfig));cloud.client=null;close();cloudAccount();return;
    }
    if(mode==='cloud-close'){close();return}
    const client=await cloudClient();
    if(mode==='cloud-login'){
      const {data:result,error}=await client.auth.signInWithPassword({email:data.email.trim(),password:data.password});if(error)throw error;
      close();await cloudEnter(result.user);return;
    }
    if(mode==='cloud-member'){
      const {error}=await client.rpc('dit_set_member',{p_id:form.dataset.id,p_email:data.email,p_role:data.role});if(error)throw error;
      close();toast('项目成员权限已更新。');
    }
  }
  async function cloudAction(btn){
    const action=btn.dataset.action;
    if(action==='cloud-account')return cloudAccount();
    if(action==='cloud-settings')return cloudSettings();
    if(action==='cloud-sync'){flushChecklistEdits();await cloudPull();await cloudSync();render();close();return}
    if(action==='cloud-members')return cloudMembers();
    if(action==='cloud-logout'){if(cloud.busy)throw Error('正在同步，请稍后退出。');await cloud.client.auth.signOut({scope:'local'});cloudLeave();return}
    if(action==='cloud-signup'){
      const client=await cloudClient(),form=$('#edit-form'),data=Object.fromEntries(new FormData(form));
      if(data.password.length<8)throw Error('密码至少 8 位。');
      const {data:result,error}=await client.auth.signUp({email:data.email.trim(),password:data.password});if(error)throw error;
      if(result.session){close();await cloudEnter(result.user)}else toast('注册请求已提交，请查看邮箱确认邮件。');return;
    }
    if(action==='cloud-conflict-export'){
      const p=state.projects.find(p=>p.id===btn.dataset.id);if(!p)throw Error('本机已删除此项目，可直接采用云端版本。');
      await saveSelectedBackup([p.id]);return;
    }
    if(action==='cloud-conflict-reload'){
      const key=btn.dataset.id;
      if(!confirm('采用云端版本会替换本机未同步的修改。需要保留时请先导出本机版本。'))return;
      const {data:row,error}=await cloud.client.from('dit_projects').select('*').eq('id',key).maybeSingle();if(error)throw error;
      state.projects=state.projects.filter(p=>p.id!==key);delete cloud.rows[key];delete cloud.roles[key];delete cloud.conflicts[key];
      if(row&&!row.deleted){const p=cloudCopy(row.content);normalizeProject(p);state.projects.push(p);cloud.rows[key]={revision:row.revision,json:projectJSON(p)};cloud.roles[key]=row.owner_id===cloud.user.id?'owner':'viewer'}
      cloudCache();close();await cloudPull();render();return;
    }
  }
  document.addEventListener('click',e=>{
    const btn=e.target.closest('[data-action]');if(!btn)return;
    if(btn.dataset.action.startsWith('cloud-')){e.preventDefault();e.stopImmediatePropagation();cloudAction(btn).catch(error=>toast(cloudError(error)));return}
    if(cloud.user&&['import','delete-project'].includes(btn.dataset.action)){
      if(btn.dataset.action==='import'||cloud.roles[btn.dataset.id]!=='owner'){e.preventDefault();e.stopImmediatePropagation();toast(btn.dataset.action==='import'?'云端工作区暂不提供导入。请退出账号后在本机工作区导入。':'只有项目所有者可以删除项目。');return}
    }
    if(cloud.user&&cloud.roles[project()?.id]==='viewer'&&!cloudAllowedAction(btn.dataset.action)&&btn.dataset.action!=='new-project'){
      e.preventDefault();e.stopImmediatePropagation();toast('你对此项目只有查看权限。');
    }
  },true);
  document.addEventListener('submit',e=>{
    if(e.target.dataset.mode?.startsWith('cloud-')){e.preventDefault();e.stopImmediatePropagation();const form=e.target,submit=form.querySelector('[type=submit]');submit.disabled=true;cloudForm(form).catch(error=>toast(cloudError(error))).finally(()=>submit.disabled=false);return}
    if(cloud.user&&cloud.roles[project()?.id]==='viewer'&&!['new-project','export-backup','print-checklist','print-archive'].includes(e.target.dataset.mode)){
      e.preventDefault();e.stopImmediatePropagation();toast('你对此项目只有查看权限。');
    }
  },true);
  window.addEventListener('online',()=>cloudSchedulePull());
  document.addEventListener('focusout',e=>{if(cloud.user&&e.target.matches('.content input,.content textarea,.content select'))cloudSchedulePull()});
  const localClose=close;
  close=function(){localClose();if(cloud.user)cloudSchedulePull()};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cloud.user)cloudSchedulePull()});
  async function cloudRestore(){
    if(!cloudConfig.url||!cloudConfig.key)return;
    try{const client=await cloudClient(),{data}=await client.auth.getSession();if(data.session)await cloudEnter(data.session.user)}catch(error){toast(cloudError(error))}
  }

  if(migrated)persist();
  render();
  cloudRestore();
})();
</script>
</body>
