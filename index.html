  const CHECKLIST_ROWS=CHECKLIST_GROUPS.flatMap(g=>g.rows);
  const CHECKLIST_ITEMS=new Map(CHECKLIST_ROWS.map(r=>[r.id,r]));
  const CHECKLIST_UNIQUE=[...CHECKLIST_ITEMS.values()];
  let checklistCameraId='',checklistTab='required';
  const checklistReasons=new Map(),checklistPending=new Map();
  let checklistSaveTimer;
  const CHECKLIST_DESCRIPTIONS={
    required:'若此项出问题，正常拍摄可能无法进行。',
    deep:'若此项出问题，拍摄仍可继续，但效率或画面效果会明显受影响。',
    whole:'检查机身功能和部件状态，便于维护保养。',
    custom:'按本项目需要补充的测试。'
  };
  function validCustomRows(value){
    if(!Array.isArray(value))return [];
    const used=new Set(CHECKLIST_ITEMS.keys());
    return value.filter(row=>{
      if(!row||typeof row!=='object'||!/^custom-[a-zA-Z0-9_-]{1,80}$/.test(row.id||'')||used.has(row.id)||typeof row.title!=='string'||!row.title.trim()||row.title.length>100)return false;
      used.add(row.id);return true;
    }).map(row=>({id:row.id,category:'自定义',title:row.title.trim(),detail:typeof row.detail==='string'?row.detail.slice(0,400):'',type:['通过 / 警告','通过 / 记录','记录'].includes(row.type)?row.type:'通过 / 警告',note:''}));
  }
  function customGroup(c){return {key:'custom',title:'自定义',rows:c.customChecklistRows||[]}}
  function checklistGroups(c){return [...CHECKLIST_GROUPS,customGroup(c)]}
  function checklistItem(c,itemId){return CHECKLIST_ITEMS.get(itemId)||(c.customChecklistRows||[]).find(row=>row.id===itemId)}
  function normalizeChecklist(c,p){
    const source=c.checklist&&typeof c.checklist==='object'&&!Array.isArray(c.checklist)?c.checklist:{};
    const legacyTesters=people(Object.values(source).map(r=>r&&typeof r.tester==='string'?r.tester:''));
    c.checklistTesters=Array.isArray(c.checklistTesters)?people(c.checklistTesters):legacyTesters.length?legacyTesters:people(p?.dit);
    c.customChecklistRows=validCustomRows(c.customChecklistRows);
    c.checklist={};
    for(const item of [...CHECKLIST_UNIQUE,...c.customChecklistRows]){
      const key=item.id;
      const r=source[key];if(!r||typeof r!=='object'||Array.isArray(r))continue;
      const text=k=>typeof r[k]==='string'?r[k]:'';
      c.checklist[key]={status:checklistOptions(item).includes(r.status)?r.status:'',notes:text('notes'),updatedAt:text('updatedAt'),serial:text('serial'),firmware:text('firmware'),notApplicable:r.notApplicable===true};
    }
  }
  function checklistOptions(row){return row.type.split(' / ').map(x=>x==='记录'?'已记录':x)}
  function checklistHasRecord(r){return !![r?.notes,r?.serial,r?.firmware].some(v=>typeof v==='string'&&v.trim())}
  function checklistStats(c,rows=[...CHECKLIST_UNIQUE,...(c.customChecklistRows||[])]){
    let done=0,warnings=0,excluded=0;
    for(const row of rows){const r=c.checklist?.[row.id];if(r?.notApplicable){excluded++;continue}if(r?.status&&(r.status!=='已记录'||checklistHasRecord(r)))done++;if(r?.status==='警告')warnings++}

  function projectPasswordField(name,label,autocomplete='off'){return `<div class="form-field full"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="password" autocomplete="${autocomplete}" required></div>`}
  function showProjectPasswordForm(rowId){
    const p=state.projects.find(x=>x.id===rowId);if(!p)return;
    const changing=hasProjectPassword(p);
    modal(changing?'修改项目密码':'设置项目密码',`<div class="form-grid">${changing?projectPasswordField('oldPassword','当前密码 *','current-password'):''}${projectPasswordField('newPassword','新密码 *','new-password')}${projectPasswordField('confirmPassword','再次输入新密码 *','new-password')}<p class="field-note">密码至少 6 位，请妥善保存；忘记后无法在网页内找回。</p></div>`,changing?'修改密码':'设置密码',{mode:'project-password',id:rowId});
  }
  function saveProjectPassword(form,data){
    const p=state.projects.find(x=>x.id===form.dataset.id);if(!p)return;
    if(hasProjectPassword(p)&&!checkProjectPassword(p,data.oldPassword||'')){toast('当前项目密码不正确。');return}
    if((data.newPassword||'').length<6){toast('项目密码至少 6 位。');return}
    if(data.newPassword!==data.confirmPassword){toast('两次输入的新密码不一致。');return}
    const changing=hasProjectPassword(p),salt=passwordSalt();p.passwordSalt=salt;p.passwordHash=passwordDigest(data.newPassword,salt);
    p.history.unshift({id:id(),at:now(),actor:'本机编辑',action:changing?'修改项目密码':'设置项目密码'});p.history=p.history.slice(0,200);
    persist();render();close();toast(changing?'项目密码已修改。':'项目密码已设置。');
  }
  function showProjectDeleteFirst(rowId){
    const p=state.projects.find(x=>x.id===rowId);if(!p)return;
    if(!hasProjectPassword(p)){activeId=p.id;view='history';persist();render();showProjectPasswordForm(p.id);toast('删除前，请先为这个项目设置密码。');return}
    modal('删除项目 · 第一次确认',`<div class="notice error"><span class="symbol">!</span><span>将删除「${esc(p.name)}」以及其中的摄影机、测试记录和录制参数。请确认要继续。</span></div>`,'继续，进行第二次确认',{mode:'project-delete-first',id:p.id,danger:true});
  }
  function showProjectDeleteFinal(rowId){
    const p=state.projects.find(x=>x.id===rowId);if(!p||!hasProjectPassword(p))return;
    modal('删除项目 · 第二次确认',`<p class="check-delete-explain">输入片名 <strong>${esc(p.name)}</strong> 和项目密码，完成删除。</p><div class="form-grid">${field('projectName','确认片名 *','','','text','full')}${projectPasswordField('deletePassword','项目密码 *','current-password')}</div>`,'永久删除项目',{mode:'project-delete-final',id:p.id,danger:true});
  }
  function deleteProjectWithPassword(form,data){
    const p=state.projects.find(x=>x.id===form.dataset.id);if(!p||!hasProjectPassword(p))return;
    if(data.projectName!==p.name){toast('片名与项目名称不一致。');return}
    if(!checkProjectPassword(p,data.deletePassword||'')){toast('项目密码不正确。');return}
    state.projects=state.projects.filter(x=>x.id!==p.id);
    if(activeId===p.id)activeId=state.projects[0]?.id||'';
    view='projects';persist();render();close();toast('项目已删除。');
  }
  function showPrintChecklistOptions(p){
    const c=activeChecklistCamera(p);if(!c)return;
    const groups=checklistGroups(c),preferred=groups.some(g=>g.key===checklistTab)?checklistTab:groups[0]?.key;
    modal('导出摄影机测试 PDF',`<p class="check-print-help">选择要导出的测试表格，签名区会放在 PDF 末尾。</p><div class="check-print-options">${groups.map(g=>`<label><input type="checkbox" name="printGroup" value="${g.key}" ${g.key===preferred?'checked':''}><span>${esc(g.title)}</span><small>${g.rows.length} 项</small></label>`).join('')}</div>`,'打印 / 存为 PDF',{mode:'print-checklist',id:c.id});
  }

  function normalizeProject(p){
    if(Array.isArray(p.cameras))for(const c of p.cameras)if(c.brand==='RED'){const old=LEGACY_RED_MODELS[c.model]||c.model;c.model=RED_MODEL_UPDATES[old]||old};
    for(const key of [...PERSON_KEYS,...VENDOR_KEYS])p[key]=people(p[key]);
    delete p.lightingVendors;delete p.otherVendors;
    p.tests=Array.isArray(p.tests)?p.tests:[];
    p.profiles=Array.isArray(p.profiles)?p.profiles:[];
    p.history=Array.isArray(p.history)?p.history:[];
    if(!Array.isArray(p.cameras)){
      const oldNames=[...new Set([...p.tests,...p.profiles].map(r=>r.camera).filter(Boolean))];
      p.cameras=oldNames.map((name,i)=>{
        const raw=name.replace(/^[a-z]_/,''),brand=/dj/i.test(raw)?'DJI':/ilce|sony/i.test(raw)?'Sony':'自定义';
        const model=raw==='ilce7rm5'?'ILCE-7RM5':raw==='djimini2'?'Mini 2':raw;
        return {id:id(),letter:letter(i),brand,model};
      });
      for(const r of [...p.tests,...p.profiles])if(!r.cameraId)r.cameraId=p.cameras.find(c=>oldNames[p.cameras.indexOf(c)]===r.camera)?.id||'';
      for(const [key,role] of [['photographer','photographers'],['firstAC','firstACs'],['secondAC','secondACs']])
        p[role]=people([...p[role],...p.tests.map(r=>r[key])]);
    }
    p.director=p.director||'';
    if(!Object.hasOwn(p,'productionManager')){
      const old=people(p.productionManagers);
      p.productionManager=old[0]||'';
      if(old.length>1)p.description=[p.description,'旧版其他制片主任：'+old.slice(1).join('、')].filter(Boolean).join('\n');
    }
    delete p.productionManagers;
    if(!Object.hasOwn(p,'executiveProducer'))p.executiveProducer='';
    if(p.productionManager){p.description=[p.description,'旧版制片主任：'+p.productionManager+'（请核对是否为总制片）'].filter(Boolean).join('\n');delete p.productionManager}
    delete p.productionManager;
    for(const r of p.tests)if(r.owner&&!p.cameraVendors.includes(r.owner))r.owner='';
    for(const r of p.profiles){if(r.bitrateUnit!=='Mb/s'){if(r.bitrate){if(r.bitrateUnit==='MB/s')r.bitrate=String(Number(r.bitrate)*8);else{r.notes=[r.notes,'旧码率：'+r.bitrate+' '+(r.bitrateUnit||'单位未标记')+'（请核对后填写 Mb/s）'].filter(Boolean).join('\n');r.bitrate=''}}r.bitrateUnit='Mb/s'}if(r.notes)r.notes=r.notes.replaceAll('（请核对后填写 MB/s）','（请核对后填写 Mb/s）');if(r.purpose==='常规录制')r.purpose='常规拍摄';else if(r.purpose==='高速录制')r.purpose='高速拍摄';else if(r.purpose==='航拍机')r.purpose='航拍';if(!r.sampling||!r.bitDepth){const old=String(r.color||'').toLowerCase();r.sampling=r.sampling||(/444|4:4:4/.test(old)?'4:4:4':/422|4:2:2/.test(old)?'4:2:2':/420|4:2:0/.test(old)?'4:2:0':/raw/.test(old)?'RAW':'未指定');r.bitDepth=r.bitDepth||(/16/.test(old)?'16-bit':/12/.test(old)?'12-bit':/10/.test(old)?'10-bit':/8/.test(old)?'8-bit':'未指定')}}
    p.cameras.forEach((c,i)=>{c.letter=letter(i);normalizeChecklist(c,p)});p.nextCameraIndex=p.cameras.length;
    for(const r of p.tests){
      if(!HEALTH.includes(r.health)&&r.health){r.notes=[r.notes,'旧健康情况：'+r.health].filter(Boolean).join('\n');r.health=''}
    }
  }

  function renderCameras(p){return `<div class="card">${sectionHeader('▣','摄影机与机位','每台摄影机独立保存测试清单；机位按顺序分配，删除后自动前移',button('＋ 增加摄影机','new-camera','primary small'),'blue')}${p.cameras.length?`<div class="camera-grid">${p.cameras.map(c=>`<div class="camera-tile"><span class="camera-letter">${esc(c.letter)}</span><span><strong>${esc(cameraLabel(c))}</strong><small>${esc(c.letter)}机</small><small class="check-camera-summary">${esc(checklistSummary(c))}</small></span><span class="camera-actions no-print">${button('测试清单','camera-checklist','primary small',`data-id="${esc(c.id)}"`)}${button('编辑','edit-camera','small',`data-id="${esc(c.id)}"`)}${button('×','delete-camera','subtle small danger',`data-id="${esc(c.id)}" aria-label="删除摄影机"`)}</span></div>`).join('')}</div>`:`<div class="empty"><strong>还没有摄影机</strong>先登记机身，再建立测试和录制方案。<br>${button('增加摄影机','new-camera','primary')}</div>`}</div>`}

  function orderedByCamera(p,rows){
    const positions=new Map(p.cameras.map((camera,index)=>[camera.id,index]));
    return rows.map((row,index)=>({row,index})).sort((a,b)=>{
      const aPosition=positions.get(a.row.cameraId)??Number.MAX_SAFE_INTEGER;
      const bPosition=positions.get(b.row.cameraId)??Number.MAX_SAFE_INTEGER;
      return aPosition-bPosition||a.index-b.index;
    }).map(item=>item.row);
  }

  function profileTable(p){const rows=orderedByCamera(p,p.profiles);return rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>机位 / 摄影机型号 / 拍摄方案</th><th>录制帧速率</th><th>录制分辨率</th><th>封装格式</th><th>编码方式</th><th>色彩采样</th><th>位深</th><th>码率</th><th>安全框</th><th class="action-col no-print">操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="name">${esc(cameraName(p,r.cameraId,r.camera))}</span><br><span style="color:#94a0ad;font-size:11px">${esc(r.purpose||'自定义')}</span></td><td>${esc(r.fps||'—')} ${r.fps?'fps':''}</td><td>${esc(r.resolution||'—')}</td><td><span class="pill blue">${esc(r.container||'—')}</span></td><td>${esc(r.codec||'—')}</td><td>${esc(r.sampling||'—')}</td><td>${esc(r.bitDepth||'—')}</td><td><span class="pill ${r.bitrateUnit==='待确认'?'amber':''}">${r.bitrate?esc(r.bitrate)+' Mb/s':'—'}</span></td><td>${esc(r.safety||'—')}</td><td class="action-col no-print">${button('编辑','edit-profile','small',`data-id="${esc(r.id)}"`)}${button('×','delete-profile','subtle small danger',`data-id="${esc(r.id)}" aria-label="删除录制参数"`)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>还没有录制方案</strong>为摄影机添加帧速率、编码和色彩参数。<br>${button('新增录制方案','new-profile','primary')}</div>`}

  function showTestForm(row){const p=project(),r=row||{},cam=p.cameras.find(c=>c.id===(r.cameraId||p.cameras[0]?.id)),options=mediaFor(cam),choice=options.includes(r.card)?r.card:r.card?'自定义':'',customCard=choice==='自定义'?r.card:'';modal(row?'编辑测试配置':'新增测试配置',`<div class="form-grid">${cameraSelect(p,r.cameraId)}${field('lens','镜头组',r.lens||'')}${pick('cardChoice','存储卡 / 介质',options.map(x=>[x,x]).concat([['自定义','自定义']]),choice)}<div class="form-field" id="custom-card-wrap" ${choice==='自定义'?'':'hidden'}>${field('customCard','自定义介质',customCard)}</div>${pick('photographer','掌机',roles(p,'photographer').map(s=>[s,s]),r.photographer,'请先在项目信息填写掌机或 DP。')}${pick('firstAC','大助',roles(p,'firstAC').map(s=>[s,s]),r.firstAC,'请先在项目信息填写大助。')}${pick('secondAC','二助',roles(p,'secondAC').map(s=>[s,s]),r.secondAC,'请先在项目信息填写二助。')}${field('health','健康状况',r.health||'','请选择|全新|优秀|良好|堪用|废品','select')}${pick('controller','控制人员',roles(p,'controller').map(s=>[s,s]),r.controller,'请先在项目信息填写 DIT、DP、大助或二助。')}${pick('owner','所有者 / 摄影器材公司',p.cameraVendors.map(s=>[s,s]),r.owner,'请先在项目信息填写摄影器材公司。')}${field('notes','测试备注',r.notes||'','','textarea','full')}${p.status==='locked'?field('reason','调整原因 *','','确认后的测试配置调整将记入记录。','textarea','full'):''}</div>`,'保存配置',{mode:'test',id:row?.id})}

  function showDelete(kind,rowId){const p=project();const r=kind==='cameras'?p.cameras.find(x=>x.id===rowId):p?.[kind]?.find(x=>x.id===rowId);if(!r)return;const label=kind==='cameras'?cameraName(p,r.id):cameraName(p,r.cameraId,r.camera);if(kind==='cameras'&&[...p.tests,...p.profiles].some(x=>x.cameraId===rowId)){toast('这台摄影机已被测试或录制方案使用，请先处理关联记录。');return}modal('确认删除',`<div class="notice error"><span class="symbol">!</span><span>将删除「${esc(label)}」${kind==='tests'?'测试配置':kind==='profiles'?'录制方案':'摄影机'}。导出备份可保留删除前的版本。</span></div>${p.status==='locked'?field('reason','删除原因 *','','确认后删除需说明原因。','textarea'):''}`,'删除',{mode:'delete-'+kind,id:rowId,danger:true})}
  function toast(msg){$('#toast-root').innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',3500)}
  function download(data,filename){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:'application/json;charset=utf-8'}));a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
  function backupProjectList(projects){return `<div class="backup-toolbar">${button('全选','backup-select-all')}${button('全不选','backup-select-none')}</div><div class="backup-project-list">${projects.map(p=>`<label class="backup-project-option"><input type="checkbox" name="projectId" value="${esc(p.id)}" checked><span><strong>${esc(p.name)}</strong><small>${p.cameras?.length||0} 台摄影机 · ${p.tests.length} 套测试配置 · ${p.profiles.length} 套录制方案</small></span></label>`).join('')||'<div class="empty">此备份没有项目。</div>'}</div>`}
  function buildSelectedBackup(selectedIds){
    const selected=new Set(selectedIds),projects=state.projects.filter(p=>selected.has(p.id));
    if(!projects.length)throw Error('请至少选择一个项目。');
    const current=projects.some(p=>p.id===activeId)?activeId:projects[0].id;
    const selectedState={...cloneData(state),projects:cloneData(projects),activeId:current,view:'overview',checklistCameraId:'',checklistTab:'required'};
    return {format:'dit-prep-workbench',appVersion:'v14',exportedAt:now(),data:selectedState};
  }
  function exportBackup(){
    if(!state.projects.length){toast('当前没有可导出的项目。');return}
    modal('选择导出项目',`<p class="backup-help">勾选要导出的项目，保存所选项目的全部资料、测试记录、项目密码和变更记录。</p>${backupProjectList(state.projects)}`,'导出所选项目',{mode:'export-backup'});
  }
  function saveSelectedBackup(selectedIds){
    try{const backup=buildSelectedBackup(selectedIds),name='DIT-P前期筹备工作空间-备份-'+new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())+'.json';download(JSON.stringify(backup,null,2),name);close();toast(`已导出 ${backup.data.projects.length} 个项目。`)}catch(err){toast(err.message)}
  }
  function prepareBackup(obj){
    if(!obj||obj.format!=='dit-prep-workbench'||obj.data?.version!==1||!Array.isArray(obj.data.projects))throw Error('不是本工作台的有效备份。');
    const data=cloneData(obj.data),used=new Set();
    for(const p of data.projects){
      if(!p||typeof p!=='object'||Array.isArray(p)||typeof p.id!=='string'||!p.id||typeof p.name!=='string'||!Array.isArray(p.tests)||!Array.isArray(p.profiles)||!Array.isArray(p.history)||used.has(p.id))throw Error('备份中的项目数据无效或编号重复。');
      used.add(p.id);
      if(p.cameras!==undefined&&(!Array.isArray(p.cameras)||p.cameras.some(c=>!c||typeof c!=='object'||typeof c.id!=='string'||typeof c.brand!=='string'||typeof c.model!=='string')))throw Error('备份中的摄影机数据无效。');
      if([...p.tests,...p.profiles,...p.history].some(row=>!row||typeof row!=='object'||Array.isArray(row)))throw Error('备份中的记录数据无效。');
      normalizeProject(p);backfillEmbeddedExample(p);
    }
    return data;
  }
  function showImportBackup(obj,fileName){
    const data=prepareBackup(obj);
    modal('选择导入方式',`<p class="backup-help">文件：${esc(fileName)}</p><div class="backup-mode-list"><label class="backup-mode"><input type="radio" name="importMode" value="append" checked><span><strong>只导入项目</strong><small>将下面勾选的项目加入当前工作区，保留现有项目；同编号项目另存为导入副本。</small></span></label><label class="backup-mode"><input type="radio" name="importMode" value="replace"><span><strong>全部覆盖</strong><small>用备份中的全部项目替换当前 ${state.projects.length} 个项目；操作前会再次确认。</small></span></label></div><div id="import-project-selection"><p class="backup-help">选择要加入的项目</p>${backupProjectList(data.projects)}</div><p id="import-replace-note" class="backup-help" hidden>将恢复文件中的全部 ${data.projects.length} 个项目，包含项目密码和变更记录。</p>`,'开始导入',{mode:'import-backup'});
    pendingImport=data;
  }
  function updateImportMode(){const replace=$('#edit-form input[name=importMode]:checked')?.value==='replace';$('#import-project-selection').hidden=replace;$('#import-replace-note').hidden=!replace}
  function importPreparedBackup(data,mode,selectedIds){
    if(!['append','replace'].includes(mode))throw Error('请选择导入方式。');
    const selected=new Set(selectedIds),incoming=cloneData(mode==='replace'?data.projects:data.projects.filter(p=>selected.has(p.id)));
    if(mode==='append'&&!incoming.length)throw Error('请至少选择一个项目。');
    if(mode==='replace'){
      state={...cloneData(data),projects:incoming};
      activeId=incoming.some(p=>p.id===data.activeId)?data.activeId:incoming[0]?.id||'';
    }else{
      const usedIds=new Set(state.projects.map(p=>p.id)),usedNames=new Set(state.projects.map(p=>p.name));
      for(const p of incoming){
        if(usedIds.has(p.id)){p.id=id();const base=p.name+'（导入副本）';let name=base,n=2;while(usedNames.has(name))name=p.name+`（导入副本 ${n++}）`;p.name=name}
        usedIds.add(p.id);usedNames.add(p.name);
      }
      state.projects.push(...incoming);activeId=incoming[0].id;
    }
    checklistCameraId='';checklistTab='required';checklistReasons.clear();checklistPending.clear();
    view=activeId?'overview':'projects';persist();render();
    return incoming.length;
  }
  function submitImportBackup(form){
    if(!pendingImport){toast('请重新选择备份文件。');return}
    const data=new FormData(form),mode=data.get('importMode'),selected=data.getAll('projectId');
    if(mode==='replace'&&!window.confirm(`全部覆盖将替换当前 ${state.projects.length} 个项目，恢复备份中的 ${pendingImport.projects.length} 个项目。请确认已保留需要的备份。继续吗？`))return;
    try{const count=importPreparedBackup(pendingImport,mode,selected);close();toast(storageError?'数据已载入，但本机保存失败，请立即导出备份。':`${mode==='replace'?'已恢复':'已导入'} ${count} 个项目。`)}catch(err){toast('导入失败：'+err.message)}
  }
  function addEmbeddedExample(){
    const p=cloneData(EMBEDDED_EXAMPLE);normalizeProject(p);
    importPreparedBackup({version:1,projects:[p]},'append',[p.id]);toast('已添加内嵌示例项目。');
  }
  function printOverview(p){
    if(!p)return;
    if(view!=='overview'){view='overview';render()}
    const originalTitle=document.title;
    const cleanName=(p.name||'未命名项目').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').trim()||'未命名项目';
    const d=new Date(),monthDay=String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    document.title=`${cleanName}_IT-P项目筹备总览${monthDay}`;
    const restore=()=>{document.title=originalTitle;window.removeEventListener('afterprint',restore)};
    window.addEventListener('afterprint',restore,{once:true});
    window.print();
  }
  function handleAction(btn){flushChecklistEdits();const act=btn.dataset.action,p=project(),rowId=btn.dataset.id;if(act==='close'){close();return}if(act==='view'){view=btn.dataset.view;persist();render();return}if(act==='open-project'){activeId=rowId;view='overview';persist();render();return}if(act==='new-project')return showProjectForm();if(act==='delete-project')return showProjectDeleteFirst(rowId);if(act==='add-example')return addEmbeddedExample();if(act==='backup-select-all'||act==='backup-select-none'){document.querySelectorAll('#edit-form input[name=projectId]').forEach(input=>input.checked=act==='backup-select-all');return}if(act==='import'){$('#import-file').click();return}if(act==='export')return exportBackup();if(act==='print')return printOverview(p);if(!p)return;if(act==='camera-checklist')return openChecklist(rowId);if(act==='checklist-tab'){if(checklistGroups(activeChecklistCamera(p)).some(g=>g.key===btn.dataset.tab)){checklistTab=btn.dataset.tab;persist();render();$('#check-tab-'+checklistTab)?.focus()}return}if(act==='checklist-cycle')return cycleChecklistResult(rowId,btn.dataset.item);if(act==='custom-edit')return editCustomChecklist(btn.dataset.item);if(act==='custom-remove')return removeCustomChecklist(btn.dataset.item);if(act==='custom-cancel')return resetCustomChecklistForm();if(act==='print-checklist')return showPrintChecklistOptions(p);if(act==='project-password')return showProjectPasswordForm(rowId||p.id);if(act==='edit-project')return showProjectForm(p);if(act==='new-camera')return showCameraForm();if(act==='edit-camera')return showCameraForm(p.cameras.find(x=>x.id===rowId));if(act==='delete-camera')return showDelete('cameras',rowId);if(act==='new-test')return p.cameras.length?showTestForm():showCameraForm();if(act==='edit-test')return showTestForm(p.tests.find(x=>x.id===rowId));if(act==='new-profile')return p.cameras.length?showProfileForm():showCameraForm();if(act==='edit-profile')return showProfileForm(p.profiles.find(x=>x.id===rowId));if(act==='delete-test')return showDelete('tests',rowId);if(act==='delete-profile')return showDelete('profiles',rowId);if(act==='confirm')return showConfirm();if(act==='unlock')return showUnlock()}
  document.addEventListener('input',e=>{if(e.target.id==='checklist-edit-reason'){updateChecklistReason(e.target);return}if(e.target.matches('[data-check-field]'))editChecklistField(e.target)});
  document.addEventListener('focusin',e=>{if(e.target.matches('.check-inline-notes'))resizeChecklistNote(e.target)});
  document.addEventListener('focusout',e=>{if(e.target.matches('[data-check-field]'))flushChecklistEdits()});
  window.addEventListener('beforeunload',flushChecklistEdits);
  window.addEventListener('pagehide',flushChecklistEdits);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushChecklistEdits()});
  document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn)handleAction(btn);else if(e.target.classList.contains('modal-shell'))close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.target.matches('.check-tab')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();flushChecklistEdits();const index=CHECKLIST_GROUPS.findIndex(g=>g.key===checklistTab);checklistTab=[...CHECKLIST_GROUPS,{key:'custom'}][e.key==='Home'?0:e.key==='End'?3:(index+(e.key==='ArrowRight'?1:3))%4].key;persist();render();$('#check-tab-'+checklistTab)?.focus()}});
  document.addEventListener('change',e=>{if(e.target.name==='importMode'){updateImportMode();return}if(e.target.matches('.check-team-input')){flushChecklistEdits();updateChecklistTeam(e.target);return}if(e.target.id==='checklist-camera'){flushChecklistEdits();checklistCameraId=e.target.value;persist();render();return}if(e.target.id==='f-brand')updateCameraForm();if(e.target.id==='f-modelChoice'){const wrap=$('#custom-model-wrap');if(wrap)wrap.hidden=e.target.value!=='自定义'}if(e.target.id==='f-purposeChoice')toggleCustom('f-purposeChoice','custom-scheme-wrap');if(e.target.id==='f-containerChoice')toggleCustom('f-containerChoice','custom-container-wrap');if(e.target.id==='f-cardChoice')toggleCustom('f-cardChoice','custom-card-wrap');if(e.target.id==='f-cameraId')updateMediaForm()});
  document.addEventListener('submit',e=>{if(e.target.id==='custom-checklist-form'){e.preventDefault();flushChecklistEdits();submitCustomChecklist(e.target);return}if(e.target.id!=='edit-form')return;e.preventDefault();const form=e.target,mode=form.dataset.mode,p=project();
    if(mode==='export-backup'){saveSelectedBackup(new FormData(form).getAll('projectId'));return}
    if(mode==='import-backup'){submitImportBackup(form);return}
    if(mode==='print-checklist'){
      const c=activeChecklistCamera(p),allowed=new Set(checklistGroups(c).map(g=>g.key));
      const selected=[...new Set(new FormData(form).getAll('printGroup'))].filter(key=>allowed.has(key));
      if(!selected.length){toast('请至少选择一个表格。');return}
      close();printChecklist(p,selected);return;
    }
    if(mode==='project-password'){saveProjectPassword(form,Object.fromEntries(new FormData(form)));return}
    if(mode==='project-delete-first'){const rowId=form.dataset.id;close();showProjectDeleteFinal(rowId);return}
    if(mode==='project-delete-final'){deleteProjectWithPassword(form,Object.fromEntries(new FormData(form)));return}
    const data=Object.fromEntries(new FormData(form));Object.keys(data).forEach(k=>data[k]=String(data[k]).trim());if((mode==='edit-project'||mode==='new-project')&&!data.name){toast('请填写片名。');return}if((mode==='test'||mode==='profile')&&!p.cameras.some(c=>c.id===data.cameraId)){toast('请从项目摄影机清单中选择机位。');return}if((mode==='test'||mode==='profile'||mode==='camera'||mode==='edit-project'||mode.startsWith('delete-'))&&p?.status==='locked'&&!data.reason){toast('已确认的项目需要填写调整原因。');return}if(mode==='new-project'||mode==='edit-project'){const values={name:data.name,executiveProducer:data.executiveProducer,director:data.director,dit:data.dit,dp:data.dp,shootDate:data.shootDate,location:data.location};for(const key of [...PERSON_KEYS,...VENDOR_KEYS])values[key]=people(data[key]);if(mode==='new-project'){const item={id:id(),...values,status:'draft',confirmedAt:'',confirmedBy:'',cameras:[],nextCameraIndex:0,tests:[],profiles:[],history:[{id:id(),at:now(),actor:'本机编辑',action:'建立项目'}]};state.projects.unshift(item);activeId=item.id;view='overview';persist();render()}else{Object.assign(p,values);let cleared=0;for(const r of p.tests){for(const key of ['photographer','firstAC','secondAC','controller'])if(r[key]&&!roles(p,key).includes(r[key])){r[key]='';cleared++}if(r.owner&&!p.cameraVendors.includes(r.owner)){r.owner='';cleared++}}mutate('更新项目信息'+(cleared?`；清空 ${cleared} 个已移除人员的测试分配`:'' )+(data.reason?`；原因：${data.reason}`:''))}}else if(mode==='camera'){const brand=data.brand==='自定义'?data.customBrand:data.brand,model=data.modelChoice==='自定义'?data.customModel:data.modelChoice;if(!brand||!model){toast('请填写摄影机品牌和型号。');return}const existing=p.cameras.find(c=>c.id===form.dataset.id),reason=data.reason;if(existing){existing.brand=brand;existing.model=model}else{p.cameras.push({id:id(),letter:letter(p.nextCameraIndex++),brand,model})}mutate(`${existing?'修改':'新增'}摄影机：${cameraName(p,(existing||p.cameras[p.cameras.length-1]).id)}${reason?`；原因：${reason}`:''}`)}else if(mode==='test'||mode==='profile'){if(mode==='test'){
      if(data.cardChoice==='自定义'&&!data.customCard){toast('请填写自定义介质。');return}
      data.card=data.cardChoice==='自定义'?data.customCard:data.cardChoice;
      delete data.cardChoice;delete data.customCard;
      for(const key of ['photographer','firstAC','secondAC','controller'])if(data[key]&&!roles(p,key).includes(data[key])){toast('人员必须从项目信息中对应职位选择。');return}if(data.owner&&!p.cameraVendors.includes(data.owner)){toast('所有者必须从摄影器材公司中选择。');return}if(!HEALTH.includes(data.health))data.health=''}if(mode==='profile'){
      if(!FRAME_RATES.includes(data.fps)||!SCHEMES.includes(data.purposeChoice)||!SAMPLINGS.includes(data.sampling)||!BIT_DEPTHS.includes(data.bitDepth)){toast('请选择有效的录制参数预设。');return}
      if(data.purposeChoice==='自定义'&&!data.customScheme){toast('请填写自定义拍摄方案。');return}
      if(data.containerChoice==='自定义'&&!data.customContainer){toast('请填写自定义封装格式。');return}
      data.purpose=data.purposeChoice==='自定义'?data.customScheme:data.purposeChoice;
      data.container=data.containerChoice==='自定义'?data.customContainer:data.containerChoice;
      data.bitrateUnit='Mb/s';
      delete data.purposeChoice;delete data.customScheme;delete data.containerChoice;delete data.customContainer;
    }const arr=mode==='test'?p.tests:p.profiles,existing=arr.find(x=>x.id===form.dataset.id),reason=data.reason;delete data.reason;data.camera=cameraName(p,data.cameraId);if(existing)Object.assign(existing,data);else arr.push({id:id(),...data});mutate(`${existing?'修改':'新增'}${mode==='test'?'测试配置':'录制方案'}：${data.camera}${reason?`；原因：${reason}`:''}`)}else if(mode==='confirm'){if(!p.dit||data.actor!==p.dit){toast('确认人员须从项目信息中的 DIT 选择。');return}if(!p.profiles.length){toast('请先建立至少一套录制方案。');return}p.status='locked';p.confirmedAt=now();p.confirmedBy=data.actor;mutate('确认基础录制参数'+(data.note?`：${data.note}`:''),data.actor)}else if(mode==='unlock'){if(!data.actor||!roles(p,'controller').includes(data.actor)||!data.reason){toast('请从 DIT、DP、大助、二助中选择并填写调整原因。');return}p.status='draft';p.confirmedAt='';p.confirmedBy='';mutate('重新开放参数调整；原因：'+data.reason,data.actor)}else if(mode.startsWith('delete-')){const kind=mode.slice(7),item=p[kind].find(x=>x.id===form.dataset.id);if(kind==='cameras'&&[...p.tests,...p.profiles].some(x=>x.cameraId===form.dataset.id)){toast('摄影机仍有关联记录，无法删除。');return}p[kind]=p[kind].filter(x=>x.id!==form.dataset.id);if(kind==='cameras'){p.cameras.forEach((c,i)=>c.letter=letter(i));p.nextCameraIndex=p.cameras.length;for(const r of [...p.tests,...p.profiles])r.camera=cameraName(p,r.cameraId,r.camera)}mutate(`删除${kind==='tests'?'测试配置':kind==='profiles'?'录制方案':'摄影机'}：${kind==='cameras'?item?.letter+'机':item?.camera||''}${data.reason?`；原因：${data.reason}`:''}`)}close();toast(storageError?'当前数据尚未保存，请立即导出备份。':'已更新并保存在本机')});
  $('#import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>10*1024*1024)throw Error('文件超过 10 MB。');showImportBackup(JSON.parse(await file.text()),file.name)}catch(err){toast('导入失败：'+err.message)}});
  if(migrated)persist();
  render();
})();
